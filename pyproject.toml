[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "speechflow"
version = "0.1.0"
description = "Local French speech transcription and evidence-based inventory extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hojo-asr==0.1.3",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "transformers==4.57.3",
  "huggingface-hub>=0.34,<1",
  "numpy==1.26.4",
  "silero-vad==6.2.0",
  "sounddevice==0.5.3",
  "imageio-ffmpeg==0.6.0",
  "pydantic>=2.11,<3",
  "psutil>=6,<8",
]

[project.scripts]
speechflow = "speechflow.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/speechflow"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/extraction/tests"]
markers = ["real_models: runs local model weights", "microphone: opens a physical capture device"]
